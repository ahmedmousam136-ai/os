.top b{font-family:"IBM Plex Sans",sans-serif;font-size:16px;letter-spacing:-.01em}.top b span{color:var(--g2)}
.top small{display:block;font-size:12px;color:var(--ink2)}
.lang{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font:600 13px "IBM Plex Sans",sans-serif;cursor:pointer;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 6px 24px rgba(10,60,40,.06)}
h1{font-size:19px;margin:0 0 4px}.sub{color:var(--ink2);font-size:14px;margin:0}
.fac{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--gbg);border-radius:12px;color:var(--g);font-weight:600;margin:16px 0 4px}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 8px}
input{width:100%;font:700 30px/1 "IBM Plex Sans",sans-serif;letter-spacing:.4em;text-align:center;padding:14px 10px;border:1.5px solid #C9D5CF;border-radius:14px;outline:none;color:var(--ink)}
input:focus{border-color:var(--g2);box-shadow:0 0 0 4px rgba(27,184,128,.18)}
button.go{width:100%;margin-top:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font:700 16px "Noto Sans Bengali","IBM Plex Sans",sans-serif;padding:15px;cursor:pointer}
button.go:disabled{opacity:.6;cursor:default}
.err{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--rbg);color:var(--red);font-size:14px}
.note{font-size:12.5px;color:var(--ink2);margin:14px 0 0;line-height:1.5}
.ro{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.ro b{color:var(--g)}
.docf{width:100%;height:78vh;min-height:520px;border:1px solid var(--line);border-radius:14px;background:#fff}
.closed{text-align:center;padding:28px 10px}.closed .ic{font-size:40px}
.foot{font-size:11.5px;color:var(--ink2);text-align:center}

</head>
<body>
<div class="w" id="w">
  <div class="top"><span class="mark" aria-hidden="true"></span><div><b>Aura<span>Scale</span></b><small id="t-sub"></small></div><button class="lang" id="lang" type="button">EN</button></div>
  <div class="card" id="box"><p class="sub" id="t-wait"></p></div>
  <p class="foot" id="t-foot"></p>
</div>
<script>
(function () {
  'use strict';
  var URL0 = 'https://qquyqejqrxfhtmidmgkb.supabase.co', KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxdXlxZWpxcnhmaHRtaWRtZ2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NzA1MTIsImV4cCI6MjA5NjM0NjUxMn0.b7TgPU6ZzhC3-ahx-j0BRiRpJ9geyEMkePpV7KFyoZI';
  var T = {
    bn: {sub: 'স্বাস্থ্য ইতিহাস · শুধু দেখার জন্য', wait: 'লোড হচ্ছে…', t: 'রোগীর স্বাস্থ্য ইতিহাস', s: 'রোগী বা পরিবার আপনাকে যে ৬ সংখ্যার PIN বলেছেন সেটি দিন।', pin: 'অ্যাক্সেস PIN', open: 'রেকর্ড খুলুন', opening: 'খুলছে…',
      wrong: 'PIN মেলেনি। আর {n} বার চেষ্টা করা যাবে।', locked: 'অনেকবার ভুল PIN — নিরাপত্তার জন্য লিংকটি বন্ধ হয়ে গেছে। নার্সিং হোমকে নতুন লিংক দিতে বলুন।',
      closed: 'এই লিংকটি বন্ধ করা হয়েছে বা আর চালু নেই।', expired: 'এই লিংকের মেয়াদ শেষ। নার্সিং হোমকে নতুন লিংক দিতে বলুন।', bad: 'লিংকটি ঠিক নেই। QR আবার স্ক্যান করুন।', net: 'ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।',
      ro: 'শুধু দেখার জন্য — রোগীর সম্মতিতে শেয়ার করা', till: 'চালু থাকবে {d} পর্যন্ত', once: 'এই লিংক একবারই খোলা যায় — এই পাতা বন্ধ করলে আর খুলবে না।',
      note: 'রোগীর তথ্য গোপন। এই পাতা অন্য কাউকে পাঠাবেন না। চিকিৎসার সিদ্ধান্ত আপনার নিজের পরীক্ষা ও বিচারের উপর নির্ভর করবে।', foot: 'AuraScale OS · নিরাপদ শেয়ার'},
    en: {sub: 'Health history · view only', wait: 'Loading…', t: 'Patient health history', s: 'Enter the 6-digit PIN the patient or family told you.', pin: 'Access PIN', open: 'Open record', opening: 'Opening…',
      wrong: 'PIN did not match. {n} tries left.', locked: 'Too many wrong PINs — the link has been closed for safety. Ask the nursing home for a new one.',
      closed: 'This link has been closed or is no longer active.', expired: 'This link has expired. Ask the nursing home for a new one.', bad: 'This link is not valid. Scan the QR again.', net: 'Check the internet connection and try again.',
      ro: 'View only — shared with the patient’s consent', till: 'Valid till {d}', once: 'This link opens only once — after you close this page it will not open again.',
      note: 'Patient information is confidential. Do not forward this page. Treatment decisions rest on your own examination and judgement.', foot: 'AuraScale OS · secure sharing'}
  };
  var lang = 'bn'; try { var l = localStorage.getItem('aurascale_lang'); if (l === 'en') lang = 'en'; } catch (e) {}
  var tok = new URLSearchParams(location.search).get('t') || '';
  var st = {view: 'wait', clinic: '', doc: '', exp: null, err: '', html: '', once: false};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  var t = function (k, v) { var s = T[lang][k] || k; if (v) Object.keys(v).forEach(function (x) { s = s.replace('{' + x + '}', v[x]); }); return s; };
  var fd = function (d) { try { return new Date(d).toLocaleString(lang === 'bn' ? 'bn-IN' : 'en-IN', {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'}); } catch (e) { return ''; } };
  function rpc(fn, body) {
    return fetch(URL0 + '/rest/v1/rpc/' + fn, {method: 'POST', headers: {'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(body)})
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }
  function render() {
    document.documentElement.lang = lang; $('lang').textContent = lang === 'bn' ? 'EN' : 'বাং';
    $('t-sub').textContent = t('sub'); $('t-foot').textContent = t('foot');
    $('w').className = 'w' + (st.view === 'doc' ? ' wide' : '');
    var b = $('box');
    if (st.view === 'wait') { b.innerHTML = '<p class="sub">' + t('wait') + '</p>'; return; }
    if (st.view === 'closed') { b.innerHTML = '<div class="closed"><div class="ic" aria-hidden="true">&#128274;</div><h1>' + esc(st.clinic || t('t')) + '</h1><p class="sub">' + t(st.err || 'closed') + '</p></div>'; return; }
    if (st.view === 'pin') {
      b.innerHTML = '<h1>' + t('t') + '</h1><p class="sub">' + t('s') + '</p>' + (st.clinic ? '<div class="fac">&#127973; ' + esc(st.clinic) + (st.doc ? ' · <span style="font-family:IBM Plex Sans,sans-serif">' + esc(st.doc) + '</span>' : '') + '</div>' : '')
        + '<label for="pin">' + t('pin') + '</label><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" aria-label="PIN">'
        + (st.err ? '<p class="err" role="alert">' + st.err + '</p>' : '') + '<button class="go" id="go" type="button">' + t('open') + '</button>'
        + (st.exp ? '<p class="note">' + t('till', {d: esc(fd(st.exp))}) + '</p>' : '') + '<p class="note">' + t('note') + '</p>';
      var i = $('pin'); i.focus(); i.addEventListener('input', function () { i.value = i.value.replace(/\D/g, '').slice(0, 6); });
      i.addEventListener('keydown', function (e) { if (e.key === 'Enter') open(); }); $('go').addEventListener('click', open); return;
    }
    if (st.view === 'doc') {
      b.innerHTML = '<div class="ro"><span>&#128737; <b>' + t('ro') + '</b></span><span>' + (st.once ? t('once') : st.exp ? t('till', {d: esc(fd(st.exp))}) : '') + '</span></div>'
        + '<iframe class="docf" id="docf" sandbox="" referrerpolicy="no-referrer" title="' + t('t') + '"></iframe><p class="note">' + t('note') + '</p>';
      $('docf').srcdoc = st.html;
    }
  }
  function open() {
    var i = $('pin'), pin = i ? i.value.trim() : ''; if (!/^\d{6}$/.test(pin)) { if (i) i.focus(); return; }
    var g = $('go'); g.disabled = true; g.textContent = t('opening');
    rpc('nh_history_open', {p_token: tok, p_pin: pin}).then(function (r) {
      if (r && r.ok) { st.view = 'doc'; st.html = r.html || ''; st.exp = r.expires_at; st.once = !!r.one_time; st.err = ''; render(); return; }
      var why = r && r.reason;
      if (why === 'wrong') { st.err = t('wrong', {n: lang === 'bn' ? Number(r.left).toLocaleString('bn-IN') : r.left}); render(); return; }
      st.view = 'closed'; st.err = why === 'locked' ? 'locked' : why === 'expired' ? 'expired' : 'closed'; render();
    }).catch(function () { st.err = t('net'); render(); });
  }
  $('lang').addEventListener('click', function () { lang = lang === 'bn' ? 'en' : 'bn'; if (st.view === 'pin' && st.err) st.err = ''; render(); });
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(tok)) { st.view = 'closed'; st.err = 'bad'; render(); return; }
  render();
  rpc('nh_history_peek', {p_token: tok}).then(function (r) {
    st.clinic = (r && r.clinic) || ''; st.doc = (r && r.doc_no) || ''; st.exp = r && r.expires_at;
    if (r && r.ok) st.view = 'pin'; else { st.view = 'closed'; st.err = r && r.reason === 'expired' ? 'expired' : 'closed'; }
    render();
  }).catch(function () { st.view = 'pin'; st.err = t('net'); render(); });
})();
</script>
