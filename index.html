<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>AuraScale — Choose your system</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;width:100%;background:#0C1220}
body::before{
  content:'';position:fixed;
  top:-80px;left:-80px;
  width:340px;height:340px;
  background:radial-gradient(ellipse,rgba(60,100,220,.22) 0%,transparent 68%);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;
  bottom:-80px;right:-80px;
  width:320px;height:320px;
  background:radial-gradient(ellipse,rgba(18,160,100,.18) 0%,transparent 68%);
  pointer-events:none;z-index:0;
}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  color:#D4DCE8;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;padding:32px 20px;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  width:100%;max-width:340px;
  display:flex;flex-direction:column;
  align-items:center;
  position:relative;z-index:1;
}
/* ── LOGO ── */
.logo{text-align:center;margin-bottom:44px}
.brand{
  font-family:'Instrument Serif',serif;
  font-size:46px;letter-spacing:-.01em;line-height:1;
}
.a{color:#D8E2EF}
.s{color:#6FA3F8}
.sub{
  font-size:14px;color:#4A5E78;
  margin-top:10px;font-weight:400;letter-spacing:.01em;
}
/* ── CARDS ── */
.cards{width:100%;display:flex;flex-direction:column;gap:14px;margin-bottom:48px}
.card{
  display:flex;align-items:center;gap:15px;
  padding:17px 16px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.065);
  border-radius:16px;
  text-decoration:none;color:inherit;
  transition:background .15s;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}
.card:hover{background:rgba(255,255,255,.065)}
.icon{
  width:50px;height:50px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.icon-c{background:#152244}
.icon-n{background:#0C2E1E}
.info{flex:1;min-width:0}
.card-title{font-size:16px;font-weight:700;color:#D8E2EF;margin-bottom:3px}
.card-sub{font-size:12px;color:#3D5268;line-height:1.45}
.arr{font-size:22px;color:#253648;flex-shrink:0;line-height:1}
/* ── FOOTER ── */
.foot{font-size:12.5px;color:#1E2D3D;font-weight:500;letter-spacing:.03em}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="brand"><span class="a">Aura</span><span class="s">Scale</span></div>
    <div class="sub">Choose your system</div>
  </div>

  <div class="cards">
    <a class="card" href="clinic.html">
      <div class="icon icon-c">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5B9BF8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <div class="info">
        <div class="card-title">Clinic</div>
        <div class="card-sub">Clinic Operating System</div>
      </div>
      <div class="arr">›</div>
    </a>

    <a class="card" href="nh.html">
      <div class="icon icon-n">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1EBD80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div class="info">
        <div class="card-title">Nursing Home</div>
        <div class="card-sub">Nursing Home Operating System</div>
      </div>
      <div class="arr">›</div>
    </a>
  </div>

  <div class="foot">AuraScale</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var h = window.location.hash   || '';
  var s = window.location.search || '';
  var isReset = h.includes('type=recovery')
             || (s.includes('code=') && !s.includes('error='))
             || s.includes('type=recovery');
  if(isReset){
    window.location.replace('reset-password.html' + s + h);
  }
})();
</script>
</body>
</html>
