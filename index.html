<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;width:100%;background:#0C1220}
body::before{
  content:'';position:fixed;
  top:-80px;left:-80px;
  width:340px;height:340px;
  background:radial-gradient(ellipse,rgba(60,100,220,.22) 0%,transparent 68%);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;
  bottom:-80px;right:-80px;
  width:320px;height:320px;
  background:radial-gradient(ellipse,rgba(18,160,100,.18) 0%,transparent 68%);
  pointer-events:none;z-index:0;
}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  color:#D4DCE8;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;padding:32px 20px;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  width:100%;max-width:340px;
  display:flex;flex-direction:column;
  align-items:center;
  position:relative;z-index:1;
}
/* ── LOGO ── */
.logo{text-align:center;margin-bottom:44px}
.brand{
  font-family:'Instrument Serif',serif;
  font-size:46px;letter-spacing:-.01em;line-height:1;
}
.a{color:#D8E2EF}
.s{color:#6FA3F8}
.sub{
  font-size:14px;color:#4A5E78;
  margin-top:10px;font-weight:400;letter-spacing:.01em;
}
/* ── CARDS ── */
.cards{width:100%;display:flex;flex-direction:column;gap:14px;margin-bottom:48px}
.card{
  display:flex;align-items:center;gap:15px;
  padding:17px 16px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.065);
  border-radius:16px;
  text-decoration:none;color:inherit;
  transition:background .15s;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}
.card:hover{background:rgba(255,255,255,.065)}
.icon{
  width:50px;height:50px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.icon-c{background:#152244}
.icon-n{background:#0C2E1E}
.info{flex:1;min-width:0}
.card-title{font-size:16px;font-weight:700;color:#D8E2EF;margin-bottom:3px}
.card-sub{font-size:12px;color:#3D5268;line-height:1.45}
.arr{font-size:22px;color:#253648;flex-shrink:0;line-height:1}
/* ── FOOTER ── */
.foot{font-size:12.5px;color:#1E2D3D;font-weight:500;letter-spacing:.03em}
/* ===== AuraScale mark (first logo) — calm, soft, consistent across portals ===== */
:root{--aura-mark:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NDAgNjQwIiB3aWR0aD0iNjQwIiBoZWlnaHQ9IjY0MCI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+CiAgICAgIDxzdG9wIG9mZnNldD0iMCIgc3RvcC1jb2xvcj0iIzFCQjg4MCIvPgogICAgICA8c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMwQTZCNEIiLz4KICAgIDwvbGluZWFyR3JhZGllbnQ+CiAgPC9kZWZzPgogIDxyZWN0IHdpZHRoPSI2NDAiIGhlaWdodD0iNjQwIiBmaWxsPSJ1cmwoI2JnKSIvPgogIDxnIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0ZGRkZGRiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIj4KICAgIDxwYXRoIGQ9Ik0gMjI3IDEzMyBBIDExOCAxMTggMCAwIDEgNDEzIDEzMyIgc3Ryb2tlLXdpZHRoPSIxNiIgb3BhY2l0eT0iMC4zOCIvPgogICAgPHBhdGggZD0iTSAyNjIgMTU0IEEgNzggNzggMCAwIDEgMzc4IDE1NCIgc3Ryb2tlLXdpZHRoPSIxNiIgb3BhY2l0eT0iMC43Ii8+CiAgPC9nPgogIDxwYXRoIGQ9Ik0gMTk2IDQ1MiBMIDMyMCAyMTQgTCA0NDQgNDUyIiBmaWxsPSJub25lIiBzdHJva2U9IiNGRkZGRkYiIHN0cm9rZS13aWR0aD0iNTQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgogIDxnIGZpbGw9IiM3Q0U2QkMiPgogICAgPHJlY3QgeD0iMjg0IiB5PSIzNDgiIHdpZHRoPSI3MiIgaGVpZ2h0PSIyNCIgcng9IjEyIi8+CiAgICA8cmVjdCB4PSIzMDgiIHk9IjMyNCIgd2lkdGg9IjI0IiBoZWlnaHQ9IjcyIiByeD0iMTIiLz4KICA8L2c+Cjwvc3ZnPgo=")}
.aura-mark{display:inline-block;width:36px;height:36px;border-radius:22%;background:var(--aura-mark) center/126% no-repeat;flex-shrink:0;box-shadow:0 3px 10px rgba(10,107,75,.35),inset 0 0 0 1px rgba(255,255,255,.14)}
.sb-brand{display:flex;align-items:center;gap:11px}
.sb-brand-txt{min-width:0}
.sb-logo .sb-mark{line-height:1.05}
.sb-logo .sb-mark .s{color:#37C493}
.sb-logo .sb-tag{margin-top:4px;letter-spacing:.07em}
.aura-hero{display:flex;justify-content:center;margin-bottom:14px}
.aura-mark-lg{width:78px;height:78px;border-radius:22px;box-shadow:0 8px 26px rgba(10,107,75,.30),inset 0 0 0 1px rgba(255,255,255,.16)}
.auth-word .a,.auth-word .s{font-size:28px!important}
.auth-word .a{color:var(--text-primary)!important}
.auth-word .s{color:#12976A!important}
.auth-word .os{font-size:11px!important}
@keyframes auraRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes auraIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes auraBreathe{0%,100%{box-shadow:0 8px 26px rgba(10,107,75,.28),0 0 0 0 rgba(27,184,128,0),inset 0 0 0 1px rgba(255,255,255,.16)}50%{box-shadow:0 10px 32px rgba(10,107,75,.38),0 0 0 12px rgba(27,184,128,.08),inset 0 0 0 1px rgba(255,255,255,.16)}}
#auth-screen .auth-card{animation:auraRise .8s cubic-bezier(.2,.7,.2,1) both}
#auth-screen .aura-mark-lg{animation:auraIn 1s cubic-bezier(.2,.7,.2,1) both,auraBreathe 6.5s ease-in-out 1.2s infinite}
#auth-screen{background:radial-gradient(1100px 560px at 50% -8%,rgba(27,184,128,.15),transparent 62%),radial-gradient(800px 480px at 100% 108%,rgba(27,184,128,.10),transparent 58%),var(--bg)}
@media (prefers-reduced-motion:reduce){#auth-screen .auth-card,#auth-screen .aura-mark-lg{animation:none}}

.logo{margin-bottom:34px}.aura-mark-lg{width:96px;height:96px;border-radius:26px;animation:auraIn 1s both,auraBreathe 6.5s ease-in-out 1.2s infinite}
.aura-hero{margin-bottom:16px}.brand .s{color:#12976A!important}
body{background:radial-gradient(1100px 560px at 50% -8%,rgba(27,184,128,.15),transparent 62%),radial-gradient(800px 480px at 100% 108%,rgba(27,184,128,.10),transparent 58%),var(--bg,#F8F9FB)!important}
.wrap{animation:auraRise .8s cubic-bezier(.2,.7,.2,1) both}
.card{transition:transform .25s,box-shadow .25s,border-color .25s,background .2s}.card:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.aura-mark-lg,.wrap{animation:none!important}}


html,body{background:#F6FBF8!important;color:#17332b}
.a{color:#17332b!important}.sub{color:#5f7a71!important}

.card:hover{background:#fff!important;border-color:#8fd6b8!important;box-shadow:0 10px 26px rgba(18,151,106,.16)!important}
.card-title{color:#17332b!important}.card-sub{color:#5f7a71!important}.arr{color:#7fc7a9!important}.foot{color:#8aa299!important}
.icon-c,.icon-n{background:linear-gradient(145deg,#e4f7ee,#cfeee0)!important}
.icon-c svg,.icon-n svg{stroke:#0f7a56!important}
body::before,body::after{background:none!important}
</style>
</head>
