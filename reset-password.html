<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>AuraScale OS — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#0C1220}
body{font-family:'DM Sans',system-ui,sans-serif;color:#D4DCE8;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 20px;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
body::before{content:'';position:fixed;top:-80px;left:-80px;width:340px;height:340px;background:radial-gradient(ellipse,rgba(60,100,220,.22) 0%,transparent 68%);pointer-events:none}
body::after{content:'';position:fixed;bottom:-80px;right:-80px;width:320px;height:320px;background:radial-gradient(ellipse,rgba(18,160,100,.18) 0%,transparent 68%);pointer-events:none}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:32px 28px;width:100%;max-width:400px;position:relative;z-index:1;box-shadow:0 24px 64px rgba(0,0,0,.4);animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{text-align:center;margin-bottom:28px}
.brand{font-family:'Instrument Serif',serif;font-size:32px;letter-spacing:-.01em}
.brand .a{color:#D8E2EF}.brand .s{color:#6FA3F8}
.logo-sub{font-size:12px;color:#4A5E78;margin-top:6px}
h2{font-size:18px;font-weight:700;color:#D8E2EF;margin-bottom:6px}
.sub{font-size:12.5px;color:#4A5E78;margin-bottom:22px;line-height:1.55}
.flbl{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:#4A5E78;margin-bottom:5px}
.finput{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px 14px;color:#D8E2EF;font-size:14px;font-family:'DM Sans',sans-serif;transition:border-color .15s;min-height:46px;margin-bottom:14px;-webkit-appearance:none}
.finput:focus{outline:none;border-color:#6FA3F8}
.btn{width:100%;background:#2563EB;color:#fff;font-family:'DM Sans',sans-serif;font-weight:700;padding:13px;border-radius:8px;font-size:14px;cursor:pointer;border:none;min-height:46px;transition:background .15s;margin-top:4px}
.btn:hover{background:#1D4ED8}
.btn:disabled{background:#1A3A7A;cursor:not-allowed;opacity:.7}
.msg{border-radius:8px;padding:11px 13px;font-size:12.5px;margin-bottom:14px;display:none;line-height:1.5}
.msg-err{background:rgba(220,50,50,.12);border:1px solid rgba(220,50,50,.3);color:#F87171}
.msg-ok{background:rgba(18,176,100,.1);border:1px solid rgba(18,176,100,.3);color:#34D399}
.back{display:block;text-align:center;margin-top:18px;font-size:12px;color:#3D5268;text-decoration:none;transition:color .15s}
.back:hover{color:#6FA3F8}
.spin-wrap{text-align:center;padding:20px 0}
.spin{width:28px;height:28px;border:2.5px solid rgba(255,255,255,.1);border-top-color:#6FA3F8;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="brand"><span class="a">Aura</span><span class="s">Scale</span></div>
    <div class="logo-sub">Nursing Home OS</div>
  </div>

  <!-- Loading -->
  <div id="s-loading">
    <div class="spin-wrap">
      <div class="spin"></div>
      <div style="font-size:13px;color:#4A5E78">Verifying reset link…</div>
    </div>
  </div>

  <!-- Expired -->
  <div id="s-error" style="display:none">
    <h2>Link Expired</h2>
    <p class="sub">This reset link has expired or already been used. Request a new one.</p>
    <a href="nh.html" class="btn" style="display:block;text-align:center;text-decoration:none;padding:13px">Request New Reset Link</a>
  </div>

  <!-- Form -->
  <div id="s-form" style="display:none">
    <h2>Set New Password</h2>
    <p class="sub">Choose a new password for your AuraScale OS account.</p>
    <div class="msg msg-err" id="msg-err"></div>
    <label class="flbl">New Password</label>
    <input class="finput" id="p1" type="password" placeholder="Minimum 6 characters" autocomplete="new-password"/>
    <label class="flbl">Confirm Password</label>
    <input class="finput" id="p2" type="password" placeholder="Type again" autocomplete="new-password"/>
    <button class="btn" id="save-btn" onclick="savePass()">Set New Password</button>
  </div>

  <!-- Success -->
  <div id="s-ok" style="display:none">
    <div style="text-align:center;padding:10px 0">
      <div style="font-size:42px;margin-bottom:14px">✅</div>
      <h2 style="margin-bottom:8px">Password Updated!</h2>
      <p class="sub">Redirecting you to sign in…</p>
    </div>
  </div>

  <a href="nh.html" class="back" id="back-link">← Back to Sign In</a>
</div>

<script>
/* ── CRITICAL: detectSessionInUrl MUST be false
   Otherwise Supabase JS auto-processes the code and redirects away ── */
const _sb = supabase.createClient(
  'https://qquyqejqrxfhtmidmgkb.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxdXlxZWpxcnhmaHRtaWRtZ2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NzA1MTIsImV4cCI6MjA5NjM0NjUxMn0.b7TgPU6ZzhC3-ahx-j0BRiRpJ9geyEMkePpV7KFyoZI',
  {
    auth: {
      detectSessionInUrl: false,   /* ← THIS is the key fix */
      persistSession: true,
      autoRefreshToken: true
    }
  }
);

function show(id) {
  ['s-loading','s-error','s-form','s-ok'].forEach(function(s){
    document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
  });
  /* Hide back link when form or success is showing — user must complete or use browser back */
  var backLink = document.getElementById('back-link');
  if(backLink){
    backLink.style.display = (id === 's-error' || id === 's-loading') ? 'block' : 'none';
  }
}

async function init() {
  var hash   = window.location.hash   || '';
  var search = window.location.search || '';

  try {
    /* PKCE flow — URL has ?code=xxx */
    if (search.includes('code=') && !search.includes('error=')) {
      var code = new URLSearchParams(search).get('code');
      var res  = await _sb.auth.exchangeCodeForSession(code);
      if (res.error) { show('s-error'); return; }
      show('s-form');
      return;
    }

    /* Implicit flow — URL has #access_token=xxx&type=recovery */
    if (hash.includes('type=recovery') && hash.includes('access_token')) {
      var params   = new URLSearchParams(hash.slice(1));
      var token    = params.get('access_token');
      var refresh  = params.get('refresh_token');
      if (!token) { show('s-error'); return; }
      /* Set session manually */
      var res2 = await _sb.auth.setSession({
        access_token:  token,
        refresh_token: refresh || ''
      });
      if (res2.error) { show('s-error'); return; }
      show('s-form');
      return;
    }

    /* No token at all */
    show('s-error');
  } catch(e) {
    console.error(e);
    show('s-error');
  }
}

async function savePass() {
  var p1  = (document.getElementById('p1').value || '').trim();
  var p2  = (document.getElementById('p2').value || '').trim();
  var err = document.getElementById('msg-err');
  var btn = document.getElementById('save-btn');
  err.style.display = 'none';

  if (!p1)          { err.textContent = 'Enter a new password.';                  err.style.display='block'; return; }
  if (p1.length<6)  { err.textContent = 'Password must be at least 6 characters.'; err.style.display='block'; return; }
  if (p1 !== p2)    { err.textContent = 'Passwords do not match.';                 err.style.display='block'; return; }

  btn.disabled = true;
  btn.textContent = 'Saving…';

  var { error } = await _sb.auth.updateUser({ password: p1 });
  if (error) {
    err.textContent = 'Error: ' + error.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Set New Password';
    return;
  }

  show('s-ok');
  document.getElementById('back-link').style.display = 'none';
  setTimeout(function(){ window.location.replace('nh.html'); }, 2500);
}

init();
</script>
</body>
</html>
