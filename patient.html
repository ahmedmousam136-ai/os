<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>আমার স্বাস্থ্য খাতা · AuraScale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#12976a;--gd:#0b4f3a;--gs:#e8f5ef;--gl:#cfe9dd;
  --ink:#14201b;--ink2:#4a5b53;--ink3:#7a8a83;--line:#e3ebe7;--bg:#f4f7f5;--card:#fff;
  --red:#b42318;--reds:#fdecec;--amber:#9a5b00;--ambers:#fff4e0;--blue:#1d4ed8;--blues:#eaf0ff;
  --r:16px;--sh:0 1px 2px rgba(16,40,30,.05),0 6px 24px rgba(16,40,30,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Hind Siliguri","Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,.mono{font-family:"Inter",system-ui,sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:rgba(244,247,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-family:"Inter";font-weight:800;letter-spacing:-.01em;color:var(--gd)}
.brand i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#19b07d,#0b6b4c);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.lang{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;padding:5px 12px;border-radius:99px;font-size:13px;color:var(--ink2)}
.lang button.on{background:var(--g);color:#fff;font-weight:600}
.hero{padding:36px 0 18px;text-align:center}
.hero h1{font-size:30px;line-height:1.2;margin:14px 0 8px;color:var(--gd);font-weight:700}
.hero p{margin:0 auto;max-width:440px;color:var(--ink2)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--g);background:var(--gs);border:1px solid var(--gl);padding:5px 12px;border-radius:99px}
.icons{display:flex;justify-content:center;gap:10px;margin:22px 0 4px;flex-wrap:wrap}
.icons span{display:flex;flex-direction:column;align-items:center;gap:6px;width:62px;font-size:12.5px;color:var(--ink2)}.icons em{font-style:normal}
.icons b{width:46px;height:46px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:21px;box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.login{padding:22px;margin:18px auto 0;max-width:460px}
.login label{display:block;font-weight:600;margin-bottom:8px}
.login input{width:100%;font:600 18px "Inter",sans-serif;letter-spacing:.04em;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;outline:none;text-transform:uppercase;background:#fbfdfc}
.login input:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(18,151,106,.12)}
.hint{font-size:13.5px;color:var(--ink3);margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-weight:600;font-size:16px}
.btn-main{width:100%;margin-top:16px;background:var(--g);color:#fff}
.btn-main:disabled{opacity:.6}
.err{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--reds);color:var(--red);font-size:14.5px}
.safe{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px;border-radius:12px;background:var(--gs);font-size:13.5px;color:var(--gd)}
.nolink{padding:22px;margin:18px auto 0;max-width:460px;text-align:center}
.book{display:none;padding:18px 0 40px}
.prof{padding:20px;position:relative;overflow:hidden}
.prof:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,#19b07d,#0b6b4c)}
.prof h2{margin:4px 0 2px;font-size:24px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:5px 11px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.chip.uhid{background:var(--gd);border-color:var(--gd);color:#fff;font-family:"Inter";font-weight:700;letter-spacing:.03em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{padding:12px;border-radius:12px;background:var(--bg)}
.stat small{display:block;color:var(--ink3);font-size:12.5px}
.stat b{font-family:"Inter";font-size:18px}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h3{margin:0;font-size:19px;color:var(--gd)}
.sec span{font-size:13px;color:var(--ink3)}
.visit{padding:18px;margin-bottom:14px}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.vhead h4{margin:0;font-size:17px}
.st{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.st.in{background:var(--blues);color:var(--blue)}
.st.out{background:var(--gs);color:var(--g)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.dates div{padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.dates small{display:block;font-size:12.5px;color:var(--ink3)}
.dates b{font-family:"Inter";font-size:14.5px}
.facts{display:grid;gap:6px;margin:6px 0 12px}
.fact{display:flex;gap:10px;font-size:15px}
.fact span{color:var(--ink3);min-width:118px;flex-shrink:0}
.money{display:grid;grid-template-columns:repeat(3,1fr);
